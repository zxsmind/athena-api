services:
  athena:
    # The published image, multi-arch (linux/amd64 + linux/arm64), so neither
    # platform builds anything. Pin a version tag here for a reproducible run.
    image: ghcr.io/zxsmind/athena-api:latest
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "39921"
      HOST: 0.0.0.0
      ATHENA_DATA_DIR: /data
      # Optional: choose the admin key up front (16+ chars). Without it the
      # server generates one on first boot and prints it once to the log —
      # `docker compose logs athena | grep -i "admin key"`, or read
      # /data/admin.key from the volume. See README "The admin key under Docker".
      # ATHENA_ADMIN_KEY: change-me-to-something-long
    ports:
      - "${ATHENA_PORT:-39921}:39921"
    volumes:
      - athena-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:39921/v1/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

volumes:
  athena-data:
